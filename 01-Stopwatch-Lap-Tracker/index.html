<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch & Lap Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Geist:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-container">
      <div class="dashboard-card">
        <div class="timer-section">
          <div class="timer-gauge-ring">
            <span class="gauge-label minutes">MINUTES</span>
            <span class="gauge-label seconds">SECONDS</span>
            <span class="gauge-label millis">1/100 SEC</span>
          </div>

          <div class="timer-display">
            <span class="digits">00 : 00</span>
            <span class="decimal">.</span>
            <span class="digits millis-digit">00</span>
          </div>

          <div class="current-lap-pill">
            <span class="icon-dot"></span>
            <span></span>
            <span class="lap-time-mini"></span>
          </div>

          <button class="hud-btn btn-start" id="btn-start">
            <span class="btn-icon">▶</span> START
            <span class="btn-key">SPACEBAR</span>
          </button>
          <button class="hud-btn btn-pause" id="btn-pause">
            <span class="btn-icon">⏸</span> PAUSE
            <span class="btn-key">HOLD SPACE</span>
          </button>
          <button class="hud-btn btn-lap" id="btn-record">
            <span class="btn-icon">⚑</span> LAP
            <span class="btn-key">KEY [ L ]</span>
          </button>
          <button class="hud-btn btn-reset" id="btn-reset">
            <span class="btn-icon">↺</span> RESET
            <span class="btn-key">KEY [ R ]</span>
          </button>
        </div>

        <div class="ledger-container">
          <div class="ledger-header">
            <div class="ledger-actions">
              <button class="mini-btn">↓ EXPORT CSV</button>
              <button class="mini-btn">🗑 CLEAR LAPS</button>
            </div>
          </div>

          <div class="telemetry-table">
            <div class="table-row header-row">
              <div class="col-lap">LAP #</div>
              <div class="col-split">SPLIT / LAP TIME</div>
              <div class="col-total">TOTAL ELAPSED</div>
              <div class="col-status">STATUS / DELTA</div>
            </div>

            <!-- Standard Rows (02, 01) -->
            <div class="table-row">
              <div class="col-lap">02</div>
              <div class="col-split">00:46.15</div>
              <div class="col-total">02:03.35</div>
              <div class="col-status">+3.85s</div>
            </div>
            <div class="table-row">
              <div class="col-lap">01</div>
              <div class="col-init">01:17.20</div>
              <div class="col-total">01:17.20</div>
              <div class="col-status">INIT</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./script.js" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const startBtn = document.getElementById("btn-start");
        const pauseBtn = document.getElementById("btn-pause");
        const resetBtn = document.getElementById("btn-reset");
        const recordBtn = document.getElementById("btn-record");

        startBtn.addEventListener("click", startStopwatch);
        pauseBtn.addEventListener("click", pauseStopwatch);
        resetBtn.addEventListener("click", resetStopwatch);
        recordBtn.addEventListener("click", recordLap);
      });
    </script>
  </body>
</html>
